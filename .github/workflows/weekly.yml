name: weekly predictions

on:
  schedule:
    # One run grades last week's game picks, writes next week's picks (only before its first kickoff,
    # which the code enforces) and writes last week's award predictions.
    # A week is done once its last game is over and nflverse has rebuilt player stats, which it does
    # nightly at about 09:00 UTC. Weeks 1-17 end with Monday Night Football (final whistle about
    # 04:30 UTC Tuesday), so the first clean run is Tuesday morning; week 18 ends Sunday night, so
    # Monday morning. A run that finds the week incomplete, or already written, does nothing, so:
    # Monday (week 18), Tuesday, and Wednesday at 10:47 UTC (5:47 ET in winter, 6:47 in EDT),
    # plus Tuesday 14:17 UTC in case the nightly stats run long. Off the hour, because GitHub
    # delays scheduled runs most at :00.
    - cron: "47 10 * * 1,2,3"
    - cron: "17 14 * * 2"
  workflow_dispatch:
    inputs:
      season:
        description: "Awards: season (blank = current season)"
        required: false
      week:
        description: "Awards: week to rebuild (blank = latest completed week, skipped if it already has a file). Game picks are never rebuilt."
        required: false

permissions:
  contents: write

# A manual run and a scheduled run must not push at the same time.
concurrency:
  group: weekly-predictions

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Grade game picks and write the next week's
        run: python -m predictor.games

      - name: Award predictions
        if: ${{ !cancelled() }}  # a failed game step still lets the awards run and commit
        env:  # inputs go through env, not straight into the script, so they can't inject shell code
          SEASON: ${{ inputs.season }}
          WEEK: ${{ inputs.week }}
        run: python -m predictor.awards.predict ${SEASON:+--season "$SEASON"} ${WEEK:+--week "$WEEK"}

      - name: Commit changed predictions
        if: ${{ !cancelled() }}
        run: |
          git add predictions
          if git diff --cached --quiet; then
            echo "No prediction changes, nothing to commit"
            exit 0
          fi
          list() { git diff --cached --name-only "$@" | sed 's#.*predictions/\(games/[a-z]*/\)\{0,1\}##; s#\.json##' | paste -sd ' ' -; }
          awards=$(list -- 'predictions/[0-9]*/week_*.json')
          picks=$(list --diff-filter=A -- 'predictions/games/picks/')
          graded=$(list -- 'predictions/games/results/')
          msg="predictions:${awards:+ awards $awards;}${picks:+ picks $picks;}${graded:+ graded $graded;}"
          [ "$msg" = "predictions:" ] && msg="predictions: index update"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # the commit time is the record that picks were written before kickoff, so push right away
          git commit -m "${msg%;}"
          git push
